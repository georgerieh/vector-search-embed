<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Main</title>

    <link
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/h3-js@4/dist/h3-js.umd.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>

    <script type="module" src="{{ url_for('assets', path='/model.js') }}"></script>
    <script src="{{ url_for('assets', path='/design.js') }}"></script>
    <link href="{{ url_for('assets', path='/style.css') }}" rel="stylesheet">

          
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Main</div>
        <form name="input" class="search-form" enctype="multipart/form-data">
          <label class="file-upload-label">
            <span>🖼</span>
            <span id="file-label-text">Search by photo</span>
            <input accept="image/*" id="image-in" name="image" type="file" />
          </label>
          <div class="date-row">
            <div class="field-group">
              <span class="field-label">From</span>
              <input
                class="field-input"
                id="start-date"
                name="start_date"
                type="date"
              />
            </div>
            <div class="field-group">
              <span class="field-label">To</span>
              <input
                class="field-input"
                id="end-date"
                name="end_date"
                type="date"
              />
            </div>
          </div>
          <div class="field-group">
            <span class="field-label">Country</span>
            <input
              class="field-input"
              id="country-filter"
              placeholder="e.g. FR, RU..."
              list="country-list"
            />
            <datalist id="country-list"></datalist>
          </div>
          <div class="field-group">
            <span class="field-label">City</span>
            <input
              class="field-input"
              id="city-filter"
              placeholder="e.g. Paris..."
              list="city-list"
            />
            <datalist id="city-list"></datalist>
          </div>
          <div class="field-group">
            <span class="field-label">H3 Cell</span>
            <input
              class="field-input"
              id="h3-filter"
              placeholder="H3 hex ID..."
            />
          </div>
          <div class="field-group">
            <span class="field-label">Search by face</span>
            <div
              id="face-selector"
              style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px"
            ></div>
            <div id="no-faces-msg" style="font-size: 11px; color: #8e8e93">
              No saved faces yet
            </div>
          </div>
          <div class="field-group" style="margin-top: 4px">
            <div
              id="btn-open-face-upload"
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 9px 12px;
                background: #f2f2f7;
                border-radius: 10px;
                font-size: 13px;
                color: #3c3c43;
                cursor: pointer;
                transition: background 0.15s;
                user-select: none;
              "
            >
              <span style="display: flex; align-items: center; gap: 8px">
                Add new face</span
              >
              <span style="color: #8e8e93; font-weight: bold">➔</span>
            </div>
          </div>
          <input
            class="field-input"
            id="limit"
            name="limit"
            placeholder="Max results (50)"
            type="text"
          />
          <button
            type="button"
            id="clear-btn"
            class="search-btn"
            style="background: #f2f2f7; color: #3c3c43"
          >
            Clear
          </button>
          <button class="search-btn" name="forwardBtn" type="submit">
            Search
          </button>
        </form>
        <div id="ref-preview" style="display: none; margin-top: 4px">
          <img
            id="ref-img"
            style="
              width: 100%;
              aspect-ratio: 1;
              object-fit: cover;
              border-radius: 10px;
              border: 1px solid rgba(0, 0, 0, 0.08);
            "
          />
          <div
            id="ref-label"
            style="
              font-size: 11px;
              color: #8e8e93;
              margin-top: 5px;
              text-align: center;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            "
          ></div>
        </div>
      </div>

      <div class="sidebar-stats">
        <span id="result-count">No results yet</span>
        <button
          onclick="window.deleteSelectedPhotos()"
          class="toolbar-danger-btn"
        >
          ✕ Delete Selected
        </button>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Favorites</div>
        <div class="fav-strip" id="fav-strip"></div>
      </div>
      <div
        class="sidebar-section"
        style="border-top: 1px solid rgba(0, 0, 0, 0.07)"
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
          "
        >
          <div class="section-title" style="margin: 0">Albums</div>
          <button
            id="new-album-btn"
            style="
              border: none;
              background: #007aff;
              color: white;
              border-radius: 50%;
              width: 22px;
              height: 22px;
              font-size: 16px;
              line-height: 1;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            +
          </button>
        </div>
        <div
          id="album-list"
          style="display: flex; flex-direction: column; gap: 4px"
        ></div>
      </div>
    </div>

    <!-- MAIN -->
    <script>
  // Jinja renders this array directly into your HTML page context
  {% if images %}
  window.serverImages = {{ images | tojson }};
  {% else %}
  window.serverImages = [];
  {% endif %}
</script>

<script src="{{ url_for('assets', path='/design.js') }}"></script>
    <div class="main">
      <div class="toolbar">
        <div class="view-toggle">
          <button
            class="view-btn active"
            id="btn-grid"
            onclick="window.location.href='/main'">
            Grid
          </button>
          <button class="view-btn" id="btn-info"  onclick="window.location.href='/info'">
            Stats!
          </button>
          <button class="view-btn" id="btn-memory"  onclick="window.location.href='/memory'">
            Memory
          </button>
          <button class="view-btn" id="btn-review"  onclick="window.location.href='/review'">
            Review
          </button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-info" id="toolbar-info"></div>
      </div>
      <div class="content-split" id="results-area">
        <div class="grid-pane">
          <div id="empty-state" style="display: flex">
            <div class="empty-icon"></div>
            <div class="empty-text">Find your memories</div>
            <div class="empty-sub">
              Search by photo similarity or date range
            </div>
          </div>
          <div
            id="grid-select-toolbar"
            style="
              display: none;
              align-items: center;
              gap: 10px;
              padding: 8px 0;
              margin-bottom: 6px;
            "
          >
            <span
              id="grid-select-count"
              style="font-size: 13px; color: #3c3c43; font-weight: 500"
            ></span>
            <button
              id="grid-deselect-all"
              style="
                border: none;
                background: #f2f2f7;
                color: #3c3c43;
                border-radius: 8px;
                padding: 6px 12px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
              "
            >
              Deselect all
            </button>
            <button
              id="grid-fav-selected"
              style="
                border: none;
                background: #ff3b30;
                color: white;
                border-radius: 8px;
                padding: 6px 12px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
              "
            >
              ♥ Favorite
            </button>
            <button
              id="grid-delete-selected"
              style="
                border: none;
                background: #ff3b30;
                color: white;
                border-radius: 8px;
                padding: 6px 12px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
              "
            >
              ✕ Delete
            </button>
          </div>
          <div id="photo-grid"></div>
        </div>
        <div class="map-pane" id="map-pane">
          <div class="resize-handle" id="resize-handle"></div>
          <div id="map"></div>
        </div>
      </div>

    
      <div
        id="memory-pane"
        style="
          display: none;
          flex: 1;
          overflow: hidden;
          background: #f2f2f7;
          flex-direction: row;
        "
      >
        <!-- collections sidebar -->
        <div
          id="collections-pane"
          style="
            width: 260px;
            min-width: 200px;
            flex-shrink: 0;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
          "
        >
          <div
            style="
              padding: 14px 16px;
              border-bottom: 1px solid rgba(0, 0, 0, 0.07);
              font-size: 11px;
              font-weight: 600;
              color: #8e8e93;
              text-transform: uppercase;
              letter-spacing: 0.05em;
            "
          >
            Saved Collections
          </div>
          <div
            id="saved-collections-list"
            style="
              flex: 1;
              overflow-y: auto;
              padding: 10px;
              display: flex;
              flex-direction: column;
              gap: 6px;
            "
          ></div>
        </div>

      </div>
  </body>
</html>
