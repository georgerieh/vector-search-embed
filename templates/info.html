<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats</title>

  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" rel="stylesheet" />
  <script src="https://unpkg.com/h3-js@4/dist/h3-js.umd.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
  <link href="./style.css" rel="stylesheet">
   <script type="module" src="./model.js"></script>
   <script src="./design.js"></script>
</head>

<body>
  <div class="info-header">
    <span class="info-title">Your Library</span>
    <span class="total-badge" id="total-badge">...</span>
    <div class="info-subtitle">A look at your photo collection</div>
  </div>

  <div id="info-loading" class="loading-state">
    <div class="spinner"></div>
    Loading stats...
  </div>

  <div id="info-content" style="display: none">
    <div class="card">
      <div class="card-title">Photos by Month</div>
      <div class="chart-wrap">
        <div class="chart-inner" id="month-chart"></div>
        <div class="chart-axis"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Most Active Day of Week</div>
      <div class="dow-chart" id="dow-chart"></div>
    </div>

    <div class="tables-row">
      <div class="mini-card">
        <div class="mini-title">Top Cities</div>
        <table class="mini-table" id="top-cities-table"></table>
      </div>
      <div class="mini-card">
        <div class="mini-title">Top Countries</div>
        <table class="mini-table" id="top-countries-table"></table>
      </div>
      <div class="mini-card">
        <div class="mini-title">Least Visited Cities</div>
        <div style="font-size: 10px; color: #c7c7cc; margin-bottom: 6px">
          100+ photos
        </div>
        <table class="mini-table" id="bottom-cities-table"></table>
      </div>
      <div class="mini-card">
        <div class="mini-title">Least Visited Countries</div>
        <div style="font-size: 10px; color: #c7c7cc; margin-bottom: 6px">
          100+ photos
        </div>
        <table class="mini-table" id="bottom-countries-table"></table>
      </div>
    </div>
  </div>
</body>

</html>
