<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review</title>

  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" rel="stylesheet" />
  <script src="https://unpkg.com/h3-js@4/dist/h3-js.umd.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
   <link href="./style.css" rel="stylesheet">
   <script src="./design.js"></script>
</head>

<body>
<div
      id="review-pane"
      style="
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
        background: #f2f2f7;
      "
    >
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 12px 16px;
          background: rgba(255, 255, 255, 0.88);
          border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        "
      >
        <div>
          <span style="font-size: 17px; font-weight: 600">Review</span>
          <span
            id="review-progress"
            style="font-size: 12px; color: #8e8e93; margin-left: 10px"
          ></span>
        </div>
        <button
          id="review-next-btn"
          style="
            padding: 8px 18px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
          "
        >
          Next batch →
        </button>
      </div>
      <div
        id="review-grid"
        style="
          flex: 1;
          overflow-y: auto;
          padding: 12px;
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
          gap: 3px;
          align-content: start;
        "
      ></div>
      <div
        id="review-exhausted"
        style="
          display: none;
          flex: 1;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 10px;
          color: #8e8e93;
        "
      >
        <div style="font-size: 48px">🎉</div>
        <div style="font-size: 17px; font-weight: 500; color: #3c3c43">
          All photos reviewed!
        </div>
        <button
          id="review-reset-btn"
          style="
            margin-top: 8px;
            padding: 9px 20px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
          "
        >
          Start over
        </button>
      </div>
    </div>
    </body>
    </html>
