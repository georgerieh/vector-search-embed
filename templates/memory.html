
<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memories</title>

  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" rel="stylesheet" />
  <script src="https://unpkg.com/h3-js@4/dist/h3-js.umd.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
   <link href="{{ url_for('assets', path='/style.css') }}" rel="stylesheet">
   <script src="{{ url_for('assets', path='/design.js') }}"></script>
</head>

<body>
        <div class="toolbar">
        <div class="view-toggle">
          <button
            class="view-btn active"
            id="btn-grid"
            onclick="window.location.href='/main'">
            Grid
          </button>
          <button class="view-btn" id="btn-info"  onclick="window.location.href='/info'">
            Stats!
          </button>
          <button class="view-btn" id="btn-memory"  onclick="window.location.href='/memory'">
            Memory
          </button>
          <button class="view-btn" id="btn-review"  onclick="window.location.href='/review'">
            Review
          </button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-info" id="toolbar-info"></div>
      </div>
        <div style="flex: 1; overflow-y: auto">
          <div
            id="memory-loading"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              height: 100%;
              color: #8e8e93;
              gap: 12px;
            "
          >
            <div class="spinner"></div>
            <div style="font-size: 14px">Finding a memory...</div>
          </div>

          <div id="memory-content" style="display: none; padding: 24px">
            <div
              style="
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                margin-bottom: 20px;
                flex-wrap: wrap;
                gap: 12px;
              "
            >
              <div>
                <div
                  id="memory-title"
                  style="
                    font-size: 26px;
                    font-weight: 700;
                    letter-spacing: -0.6px;
                  "
                ></div>
                <div
                  id="memory-subtitle"
                  style="font-size: 13px; color: #8e8e93; margin-top: 4px"
                ></div>
              </div>
              <div style="display: flex; gap: 8px">
                <button
                  id="memory-save-btn"
                  style="
                    padding: 9px 18px;
                    background: #007aff;
                    color: white;
                    border: none;
                    border-radius: 10px;
                    font-size: 13px;
                    font-weight: 600;
                    font-family: inherit;
                    cursor: pointer;
                    transition: background 0.15s;
                  "
                >
                  ♥ Save Collection
                </button>
                <button
                  id="memory-delete-btn"
                  style="
                    padding: 9px 18px;
                    background: #ff3b30;
                    color: white;
                    border: none;
                    border-radius: 10px;
                    font-size: 13px;
                    font-weight: 600;
                    font-family: inherit;
                    cursor: pointer;
                    transition: background 0.15s;
                  "
                >
                  ✕ Dismiss
                </button>
                <button
                  id="memory-refresh-btn"
                  style="
                    padding: 9px 18px;
                    background: white;
                    color: #007aff;
                    border: 1px solid rgba(0, 122, 255, 0.3);
                    border-radius: 10px;
                    font-size: 13px;
                    font-weight: 600;
                    font-family: inherit;
                    cursor: pointer;
                    transition: background 0.15s;
                  "
                >
                  ↻ New Memory
                </button>
                <button
                  id="memory-today-btn"
                  style="
                    padding: 9px 18px;
                    background: white;
                    color: #007aff;
                    border: 1px solid rgba(0, 122, 255, 0.3);
                    border-radius: 10px;
                    font-size: 13px;
                    font-weight: 600;
                    font-family: inherit;
                    cursor: pointer;
                  "
                >
                  Today
                </button>
              </div>
            </div>

            <!-- hero photo -->
            <div
              id="memory-hero"
              style="
                width: 100%;
                height: 280px;
                border-radius: 16px;
                background-size: cover;
                background-position: center;
                margin-bottom: 16px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
                cursor: pointer;
              "
            ></div>

            <!-- photo grid -->
            <div
              id="memory-grid"
              style="
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 3px;
                margin-bottom: 20px;
              "
            ></div>
          </div>
        </div>
      </div>
    </div>
    
</body>
</html>
